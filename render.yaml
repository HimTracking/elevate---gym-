services:
  - type: web
    name: elevate-performance-lab
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_ID
        sync: false
      - key: DB_PATH
        value: /var/data/elevate.db
    disk:
      name: elevate-data
      mountPath: /var/data
      sizeGB: 1
